<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YoutubeTweaker</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div class="brand">YT<span> / </span> TWEAKER</div><h1>A quieter YouTube.</h1><p>Keep what matters. Hide the distractions.</p></header>
<div class="toolbar"><label class="master"><span>Enable tweaks</span><input id="enabled" type="checkbox" role="switch"></label><input id="search" type="search" placeholder="Find a setting…" aria-label="Find a setting"></div>
<main id="settings"></main><p id="empty" hidden>No settings match your search.</p><footer><button id="reset">Reset settings</button><span id="status" role="status" aria-live="polite">Changes apply instantly</span></footer><script src="settings.js"></script><script src="popup.js"></script></body></html>
